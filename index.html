<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="なぜなぜ君 - あなたの「なぜ？」に延々と答えるAIチャットボット">
    <title>なぜなぜ君</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ヘッダー -->
    <header class="header">
        <h1 class="app-title">なぜなぜ君</h1>
        <button id="refreshBtn" class="refresh-btn" aria-label="質問候補を更新" title="質問候補を更新">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
        </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
        <!-- なぜなぜ君キャラクター -->
        <div class="character-container">
            <svg class="character" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- 博士の顔 -->
                <circle cx="100" cy="80" r="50" fill="#ffd4a3" stroke="#333" stroke-width="2"/>

                <!-- 目 -->
                <circle cx="85" cy="75" r="5" fill="#333"/>
                <circle cx="115" cy="75" r="5" fill="#333"/>

                <!-- 眼鏡 -->
                <circle cx="85" cy="75" r="12" fill="none" stroke="#555" stroke-width="2"/>
                <circle cx="115" cy="75" r="12" fill="none" stroke="#555" stroke-width="2"/>
                <line x1="97" y1="75" x2="103" y2="75" stroke="#555" stroke-width="2"/>

                <!-- 口 -->
                <path d="M 85 90 Q 100 98 115 90" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>

                <!-- 白髪（もじゃもじゃ） -->
                <path d="M 55 65 Q 50 50 55 40" fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
                <path d="M 65 50 Q 60 35 65 25" fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
                <path d="M 75 45 Q 75 28 80 20" fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
                <path d="M 90 42 Q 92 25 95 18" fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
                <path d="M 105 42 Q 108 25 105 18" fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
                <path d="M 120 45 Q 125 28 120 20" fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
                <path d="M 135 50 Q 140 35 135 25" fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
                <path d="M 145 65 Q 150 50 145 40" fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>

                <!-- 体（白衣） -->
                <rect x="65" y="125" width="70" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>

                <!-- ネクタイ -->
                <polygon points="100,130 95,145 100,160 105,145" fill="#3498db" stroke="#333" stroke-width="1"/>

                <!-- ポケット -->
                <rect x="80" y="150" width="15" height="20" rx="2" fill="none" stroke="#333" stroke-width="1"/>
                <line x1="87.5" y1="153" x2="87.5" y2="167" stroke="#ff6b6b" stroke-width="2"/>
            </svg>
            <p class="character-message">博士の「なぜなぜ君」じゃ！何でも聞いてくれたまえ。</p>
        </div>

        <!-- 質問ボタン3つ -->
        <div class="question-buttons" id="questionButtons">
            <button class="question-btn" data-question="お金儲けするにはどうすればいい？">お金儲けするには？</button>
            <button class="question-btn" data-question="健康で長生きするにはどうすればいい？">健康で長生きするには？</button>
            <button class="question-btn" data-question="異性にモテるにはどうすればいい？">異性にモテるには？</button>
        </div>

        <!-- 入力エリア -->
        <div class="input-container">
            <input
                type="text"
                id="userInput"
                class="user-input"
                placeholder="なぜ？と思うことを入力..."
                autocomplete="off"
            >
            <button id="sendBtn" class="send-btn" aria-label="送信">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>

        <!-- 回答表示エリア -->
        <div class="response-container" id="responseContainer">
            <div class="welcome-message">
                <p>👋 ようこそ！「なぜなぜ君」は君の疑問に答え続けるぞい。</p>
                <p>上のボタンを押すか、自由に質問を入力してみてくれたまえ。</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
